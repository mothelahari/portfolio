<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><p>WEATHER DASHBOARD</p><h1>City forecast</h1></div><form id="search"><input id="city" placeholder="Search a city" aria-label="City"><button>Search</button></form></header><section id="status" class="status">Search for a city to see the forecast.</section><section id="weather" class="weather" hidden><div class="current"><span id="condition">—</span><strong id="temp">—</strong><h2 id="name">—</h2><p id="details">—</p></div><div id="forecast" class="forecast"></div></section><footer>Frontend portfolio project · API-ready weather interface</footer></main><script src="script.js"></script></body></html>
